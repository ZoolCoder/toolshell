name: Bug report
description: Something renders or behaves wrongly.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: toolshell version
      description: From your go.mod.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and width
      description: For example "Safari 19, 390px".
  - type: dropdown
    id: where
    attributes:
      label: Where it shows
      multiple: true
      options: [light theme, dark theme, right to left, phone width, keyboard, screen reader]
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: A screenshot helps a great deal.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest page that reproduces it
      render: html
